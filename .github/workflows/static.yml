name: Deploy Japan Trip

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch Google Maps initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # Add mapEl once, regardless of indentation/spacing.
          map_el = "const mapEl = document.getElementById('trip-map');"
          if map_el not in s:
              s, count = re.subn(
                  r"(?m)^(\s*)let map\s*=\s*null\s*;",
                  lambda m: f"{m.group(1)}{map_el}\n{m.group(1)}let map = null;",
                  s,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not find 'let map = null;' in index.html")

          # Stable AdvancedMarker click event.
          s = s.replace(
              "marker.addListener('gmp-click'",
              "marker.addListener('click'"
          )

          # Correct error helper name if an older version is present.
          s = s.replace(
              "showError('เปิด Google Maps ไม่สำเร็จ:",
              "showConfigError('เปิด Google Maps ไม่สำเร็จ:"
          )

          p.write_text(s, encoding="utf-8")

          # Verify the deployed artifact will contain the fix.
          check = p.read_text(encoding="utf-8")
          if map_el not in check:
              raise SystemExit("mapEl patch verification failed")

          print("Google Maps patch OK")
          PY

      - name: Create Google Maps config
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY secret is missing"
            exit 1
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["GOOGLE_MAPS_API_KEY"]
          Path("config.js").write_text(
              "window.TRIP_CONFIG = {\n"
              f"  GOOGLE_MAPS_API_KEY: {key!r}\n"
              "};\n",
              encoding="utf-8"
          )
          print("config.js created")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
